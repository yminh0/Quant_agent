[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest-module"
version = "0.1.0"
description = "Standalone StrategySpec backtest module for QuantAgent"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "numpy>=2.0",
  "TA-Lib>=0.6",
  "quantstats>=0.0.81",
]

[tool.setuptools.packages.find]
include = ["backtest_module*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

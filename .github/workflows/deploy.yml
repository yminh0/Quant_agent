name: Deploy to SSH Server

on:
  push:
    branches:
      - main
    paths:
      - '**'
  workflow_call:
    inputs:
      evidence_s_ref:
        required: false
        type: string
      evidence_s_sha:
        required: false
        type: string
      evidence_r_ref:
        required: false
        type: string
      evidence_r_sha:
        required: false
        type: string
      evidence_o_ref:
        required: false
        type: string
      evidence_o_sha:
        required: false
        type: string
      evidence_c_ref:
        required: false
        type: string
      evidence_c_sha:
        required: false
        type: string
      rollback_drill:
        required: false
        default: false
        type: boolean
    secrets:
      SSH_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      evidence_s_ref:
        description: Immutable GitHub URL for same-SHA S evidence
        required: false
        type: string
      evidence_s_sha:
        description: Full commit SHA verified by S evidence
        required: false
        type: string
      evidence_r_ref:
        description: Immutable GitHub URL for same-SHA R evidence
        required: false
        type: string
      evidence_r_sha:
        description: Full commit SHA verified by R evidence
        required: false
        type: string
      evidence_o_ref:
        description: Immutable GitHub URL for same-SHA O evidence
        required: false
        type: string
      evidence_o_sha:
        description: Full commit SHA verified by O evidence
        required: false
        type: string
      evidence_c_ref:
        description: Immutable GitHub URL for same-SHA C evidence
        required: false
        type: string
      evidence_c_sha:
        description: Full commit SHA verified by C evidence
        required: false
        type: string
      rollback_evidence_ref:
        description: Immutable GitHub URL for same-SHA rollback drill evidence
        required: false
        type: string
      rollback_evidence_sha:
        description: Full commit SHA verified by rollback drill evidence
        required: false
        type: string
      rollback_drill:
        description: Run a controlled non-production rollback drill instead of deploy
        required: false
        default: false
        type: boolean

concurrency:
  group: quant-agent-deploy
  cancel-in-progress: false

jobs:
  release-trust:
    name: Offline release-trust gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ai/pyproject.toml
            backtest_module/pyproject.toml
            backend/pyproject.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./backtest_module -e ./ai -e "./backend[test]" pytest

      - name: Install frontend dependencies
        working-directory: fe
        run: npm ci

      - name: Verify same-SHA S/R/O/C release evidence
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TRUST_REVISION: ${{ github.sha }}
          RELEASE_TRUST_REPOSITORY: ${{ github.repository }}
          RELEASE_EVIDENCE_S_REF: ${{ inputs.evidence_s_ref }}
          RELEASE_EVIDENCE_S_SHA: ${{ inputs.evidence_s_sha }}
          RELEASE_EVIDENCE_R_REF: ${{ inputs.evidence_r_ref }}
          RELEASE_EVIDENCE_R_SHA: ${{ inputs.evidence_r_sha }}
          RELEASE_EVIDENCE_O_REF: ${{ inputs.evidence_o_ref }}
          RELEASE_EVIDENCE_O_SHA: ${{ inputs.evidence_o_sha }}
          RELEASE_EVIDENCE_C_REF: ${{ inputs.evidence_c_ref }}
          RELEASE_EVIDENCE_C_SHA: ${{ inputs.evidence_c_sha }}
        run: node scripts/evaluate-release-trust.mjs --verify-release-evidence

      - name: Verify same-SHA rollback drill evidence
        if: github.event_name == 'workflow_dispatch' && inputs.rollback_drill != true
        env:
          RELEASE_TRUST_REVISION: ${{ github.sha }}
          RELEASE_TRUST_REPOSITORY: ${{ github.repository }}
          ROLLBACK_DRILL_EVIDENCE_REF: ${{ inputs.rollback_evidence_ref }}
          ROLLBACK_DRILL_EVIDENCE_SHA: ${{ inputs.rollback_evidence_sha }}
        run: node scripts/evaluate-release-trust.mjs --verify-rollback-evidence

      - name: Verify offline release trust
        env:
          RELEASE_TRUST_PYTHON: python
        run: node scripts/evaluate-release-trust.mjs

  rollback-drill:
    name: Controlled rollback drill
    if: ${{ inputs.rollback_drill == true }}
    needs: release-trust
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Run controlled rollback drill harness
        run: node scripts/rollback-drill-harness.mjs --artifact "$RUNNER_TEMP/rollback-drill-evidence.json" --baseline-sha "${{ github.sha }}" --candidate-sha "${{ github.sha }}" --workflow-run-id "${{ github.run_id }}"

      - name: Capture rollback drill evidence
        uses: actions/upload-artifact@v4
        with:
          name: rollback-drill-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/rollback-drill-evidence.json
          if-no-files-found: error

  deploy:
    needs: release-trust
    if: ${{ inputs.rollback_drill != true }}
    runs-on: ubuntu-latest
    env:
      SSH_PORT: "30233"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install dependencies
        working-directory: fe
        run: npm ci

      - name: Build
        working-directory: fe
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SSH_PORT" quant-agent.kro.kr >> ~/.ssh/known_hosts

      - name: Create deploy directory on server
        run: |
          ssh -i ~/.ssh/id_rsa -p "$SSH_PORT" etluser@quant-agent.kro.kr \
            'set -Eeuo pipefail
             app_dir="$HOME/mvp_sp2/quant-proj"
             production_env="$HOME/mvp_sp1/quant-proj/.env"
             mkdir -p "$app_dir"
             if [ ! -e "$app_dir/.env" ]; then
               test -s "$production_env"
               cp "$production_env" "$app_dir/.env"
               chmod 600 "$app_dir/.env"
             fi'

      - name: Verify pre-deploy readiness
        run: |
          set -Eeuo pipefail

          release_state="$(ssh -i ~/.ssh/id_rsa -p "$SSH_PORT" etluser@quant-agent.kro.kr \
            'if [ -f ~/mvp_sp2/quant-proj/combined_main.py ] && [ -f ~/mvp_sp2/quant-proj/.run/release-ready ]; then printf existing; else printf initial; fi')"
          if [ "$release_state" = "initial" ]; then
            echo "No previous application release found; allowing initial deployment."
            exit 0
          fi
          if [ "$release_state" != "existing" ]; then
            echo "Unexpected pre-deploy release state: $release_state" >&2
            exit 1
          fi

          # This gates the release that is *currently running* with the gate from the
          # revision about to be deployed. A check this revision introduces is not yet
          # published by the running release, so "missing" is reported rather than
          # fatal here; unready or unexpected checks still block the deploy. The new
          # release is gated strictly after it starts (deployed-ai-api-readiness).
          check_readiness() {
            local label="$1"
            local url="$2"
            local profile="$3"
            ssh -i ~/.ssh/id_rsa -p "$SSH_PORT" etluser@quant-agent.kro.kr \
              "curl -q --fail --silent --show-error --connect-timeout 5 --max-time 15 '$url'" \
              | node scripts/readiness-semantic-gate.mjs --label "$label" --profile "$profile" --allow-missing
          }

          check_readiness "current-backend-readiness" "http://127.0.0.1:18011/readiness" backend
          check_readiness "current-ai-api-readiness" "http://127.0.0.1:18011/ai-api/readiness" ai

      - name: Verify Google auth credentials
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          test -n "$GOOGLE_CLIENT_ID"
          test -n "$GOOGLE_CLIENT_SECRET"

          # A stray newline or space picked up while copying makes Google reject an
          # otherwise correct secret, and it is invisible in every UI that shows the
          # value. Neither field can legitimately contain whitespace, so drop it.
          GOOGLE_CLIENT_ID="$(printf '%s' "$GOOGLE_CLIENT_ID" | tr -d '[:space:]')"
          GOOGLE_CLIENT_SECRET="$(printf '%s' "$GOOGLE_CLIENT_SECRET" | tr -d '[:space:]')"

          # A truncated/mangled client id still ends in .apps.googleusercontent.com, so the
          # readiness smoke below cannot tell it apart from a real one. Pin the full shape
          # here, before the deploy mutates the server .env.
          if ! printf '%s' "$GOOGLE_CLIENT_ID" \
            | grep -Eq '^[0-9]{11,13}-[a-z0-9]{32}\.apps\.googleusercontent\.com$'; then
            echo "::error::GOOGLE_CLIENT_ID secret is malformed. Expected <project-number>-<32 chars>.apps.googleusercontent.com; re-copy it from the Google Cloud console with the copy button." >&2
            exit 1
          fi

          # A secret belonging to a different (or deleted) client has a perfectly
          # normal shape, so no format check can catch a mismatched pair. Ask Google:
          # a deliberately invalid code answers invalid_grant when the credentials are
          # good and invalid_client when they are not. Network trouble is not fatal.
          token_probe="$(curl -sS --max-time 20 -X POST https://oauth2.googleapis.com/token \
            -d "client_id=$GOOGLE_CLIENT_ID" \
            -d "client_secret=$GOOGLE_CLIENT_SECRET" \
            -d 'code=deploy-preflight-intentionally-invalid' \
            -d 'grant_type=authorization_code' \
            -d 'redirect_uri=https://qt-agent.kro.kr:38010/auth/google/callback' || true)"
          # Google's own wording separates the two halves: "The OAuth client was not
          # found." blames the id, "The provided client secret is invalid." blames the
          # secret. Without it, invalid_client alone leaves both suspects standing.
          google_reason="$(printf '%s' "$token_probe" \
            | tr -d '\n' \
            | sed -n 's/.*"error_description"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"

          # A current Google client secret is "GOCSPX-" plus 28 characters. A value that
          # misses that shape is usually the wrong field copied, or a truncated paste.
          if ! printf '%s' "$GOOGLE_CLIENT_SECRET" | grep -Eq '^GOCSPX-[A-Za-z0-9_-]{20,}$'; then
            echo "::warning::GOOGLE_CLIENT_SECRET does not look like a current Google client secret (expected GOCSPX- followed by 28 characters). Length seen: ${#GOOGLE_CLIENT_SECRET}."
          fi

          case "$token_probe" in
            *invalid_client*)
              echo "::error::Google rejected the credentials with invalid_client. Google says: ${google_reason:-<no description returned>}" >&2
              # Fingerprints, not values: enough to tell which stored value is in play and
              # whether it changed between runs, without putting either one in the log.
              echo "::error::stored value fingerprints (sha256, first 12) - client_id=$(printf '%s' "$GOOGLE_CLIENT_ID" | sha256sum | cut -c1-12) secret=$(printf '%s' "$GOOGLE_CLIENT_SECRET" | sha256sum | cut -c1-12)" >&2
              echo "::error::\"The OAuth client was not found\" means GOOGLE_CLIENT_ID is wrong; \"The provided client secret is invalid\" means GOOGLE_CLIENT_SECRET does not belong to that client. Both values must come from the same OAuth client in the Google Cloud console." >&2
              exit 1
              ;;
            *invalid_grant*)
              echo "Google accepted the client credentials (invalid_grant on the throwaway code, as expected)."
              ;;
            *)
              echo "::warning::Could not verify the Google client credentials; the token endpoint gave an unexpected or empty answer. Continuing."
              ;;
          esac

          # The token probe above cannot see whether the callback URL is registered on
          # the client; that only surfaces once a person reaches the consent screen.
          # Google reports it on the redirect chain, so follow it and look.
          auth_probe="$(curl -sL --max-time 20 -A 'Mozilla/5.0' \
            "https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CLIENT_ID}&redirect_uri=https%3A%2F%2Fqt-agent.kro.kr%3A38010%2Fauth%2Fgoogle%2Fcallback&response_type=code&scope=openid+email+profile&state=deploy-preflight" || true)"
          case "$auth_probe" in
            *redirect_uri_mismatch*)
              echo "::error::https://qt-agent.kro.kr:38010/auth/google/callback is not an authorized redirect URI on this Google client. Add it to the client's Authorized redirect URIs in the Google Cloud console." >&2
              exit 1
              ;;
          esac

      - name: Create deploy snapshot archive
        run: |
          ssh -i ~/.ssh/id_rsa -p "$SSH_PORT" etluser@quant-agent.kro.kr \
            bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -Eeuo pipefail

          DEPLOYMENT_REVISION="$1"
          APP_DIR="$HOME/mvp_sp2/quant-proj"
          RELEASES_DIR="$HOME/mvp_sp2/.releases"
          SNAPSHOT_DIR="$RELEASES_DIR/$DEPLOYMENT_REVISION"
          SNAPSHOT_STAGE="$(mktemp -d "$HOME/mvp_sp1/rollback-snapshot-stage.XXXXXX")"
          SNAPSHOT_ARCHIVE="$SNAPSHOT_DIR/current-release.tar.gz"
          SNAPSHOT_CHECKSUM="$SNAPSHOT_ARCHIVE.sha256"

          cleanup() {
            rm -rf "$SNAPSHOT_STAGE"
          }

          trap cleanup EXIT
          umask 077
          mkdir -p "$RELEASES_DIR" "$SNAPSHOT_DIR"
          chmod 700 "$RELEASES_DIR" "$SNAPSHOT_DIR"

          rsync -a --delete --omit-dir-times --no-perms --no-owner --no-group \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='DE/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.releases/' \
            --exclude='.run/' \
            --exclude='.venv/' \
            --exclude='venv/' \
            --exclude='**/.venv/' \
            --exclude='**/venv/' \
            --exclude='ai/.venv/' \
            --exclude='**/__pycache__/' \
            --exclude='**/*.pyc' \
            --exclude='**/logs/' \
            --exclude='**/.pytest_cache/' \
            --exclude='**/.ruff_cache/' \
            --exclude='**/.mypy_cache/' \
            --exclude='**/.cache/' \
            "$APP_DIR/" "$SNAPSHOT_STAGE/"

          tar -C "$SNAPSHOT_STAGE" -czf "$SNAPSHOT_ARCHIVE" .
          sha256="$(sha256sum "$SNAPSHOT_ARCHIVE" | awk '{print $1}')"
          printf '%s\n' "$sha256" > "$SNAPSHOT_CHECKSUM"
          chmod 600 "$SNAPSHOT_ARCHIVE" "$SNAPSHOT_CHECKSUM"

          if tar -tzf "$SNAPSHOT_ARCHIVE" | grep -Eq '(^|/)(\.env(\..*)?|\.releases|\.run|\.venv|venv)(/|$)|(^|/)(__pycache__|logs|\.pytest_cache|\.ruff_cache|\.mypy_cache|\.cache)(/|$)|(\.pyc|\.log|\.pid|\.sock)$'; then
            echo "Snapshot archive contains disallowed entries"
            exit 1
          fi

          printf '%s\n' "${SNAPSHOT_ARCHIVE}"
          printf '%s\n' "${SNAPSHOT_CHECKSUM}"
          printf '%s\n' "${sha256}"
          REMOTE

      - name: Pin rollback readiness checker
        run: |
          set -Eeuo pipefail
          test -s scripts/readiness-semantic-gate.mjs

          scp -q -i ~/.ssh/id_rsa -P "$SSH_PORT" scripts/readiness-semantic-gate.mjs "etluser@quant-agent.kro.kr:~/mvp_sp2/.releases/$GITHUB_SHA/readiness-semantic-gate.mjs.upload"

          ssh -i ~/.ssh/id_rsa -p "$SSH_PORT" etluser@quant-agent.kro.kr bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -Eeuo pipefail

          DEPLOYMENT_REVISION="$1"
          SNAPSHOT_DIR="$HOME/mvp_sp2/.releases/$DEPLOYMENT_REVISION"
          incoming="$SNAPSHOT_DIR/readiness-semantic-gate.mjs.upload"
          target="$SNAPSHOT_DIR/readiness-semantic-gate.mjs"

          test -d "$SNAPSHOT_DIR"
          test -s "$incoming"
          chmod 600 "$incoming"
          mv "$incoming" "$target"
          test -s "$target"
          REMOTE

      - name: Mark deploy mutation started
        run: |
          echo "DEPLOY_MUTATION_STARTED=true" >> "$GITHUB_ENV"

      - name: Deploy via rsync
        run: |
          rsync -rlvvz --delete --stats \
            --old-args \
            --omit-dir-times \
            --no-perms --no-owner --no-group \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='DE/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.releases/' \
            --exclude='.run/' \
            --exclude='.venv/' \
            --exclude='venv/' \
            --exclude='**/.venv/' \
            --exclude='**/venv/' \
            --exclude='ai/.venv/' \
            --exclude='**/__pycache__/' \
            --exclude='**/*.pyc' \
            --exclude='**/logs/' \
            --exclude='**/.pytest_cache/' \
            -e "ssh -v -i ~/.ssh/id_rsa -p $SSH_PORT" \
            ./ \
            etluser@quant-agent.kro.kr:~/mvp_sp2/quant-proj/

      - name: Configure production Google auth
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          test -n "$GOOGLE_CLIENT_ID"
          test -n "$GOOGLE_CLIENT_SECRET"

          # Same trim as the verification step, so what was verified is what gets written.
          GOOGLE_CLIENT_ID="$(printf '%s' "$GOOGLE_CLIENT_ID" | tr -d '[:space:]')"
          GOOGLE_CLIENT_SECRET="$(printf '%s' "$GOOGLE_CLIENT_SECRET" | tr -d '[:space:]')"

          auth_env_file="$RUNNER_TEMP/google-auth.env"
          trap 'rm -f "$auth_env_file"' EXIT
          umask 077
          {
            printf '%s\n' 'APP_ENV=production'
            printf '%s\n' 'AUTH_ENABLED=true'
            printf 'GOOGLE_CLIENT_ID=%s\n' "$GOOGLE_CLIENT_ID"
            printf 'GOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_SECRET"
            printf '%s\n' 'GOOGLE_REDIRECT_URI=https://qt-agent.kro.kr:38010/auth/google/callback'
            printf '%s\n' 'AUTH_PUBLIC_BACKEND_ORIGIN=https://qt-agent.kro.kr:38010'
            printf '%s\n' 'AUTH_ALLOWED_ORIGINS=https://qt-agent.kro.kr:38010'
            printf '%s\n' 'EMAIL_PUBLIC_BASE_URL=https://qt-agent.kro.kr:38010'
            printf '%s\n' 'EMAIL_UNSUBSCRIBE_BASE_URL=https://qt-agent.kro.kr:38010'
            printf '%s\n' 'AUTH_ALLOWED_HOSTS=qt-agent.kro.kr,localhost,127.0.0.1'
            printf '%s\n' 'AUTH_TRUSTED_PROXY_HEADERS=true'
            printf '%s\n' 'AUTH_TRUSTED_PROXY_HOSTS=127.0.0.1,::1'
            printf '%s\n' 'AUTH_COOKIE_SECURE=true'
            printf '%s\n' 'AUTH_COOKIE_SAMESITE=lax'
          } > "$auth_env_file"

          scp -q -i ~/.ssh/id_rsa -P "$SSH_PORT" "$auth_env_file" \
            etluser@quant-agent.kro.kr:~/mvp_sp2/quant-proj/.env.auth.upload
          ssh -i ~/.ssh/id_rsa -p "$SSH_PORT" etluser@quant-agent.kro.kr <<'REMOTE'
            set -euo pipefail
            APP_DIR="$HOME/mvp_sp2/quant-proj"
            env_file="$APP_DIR/.env"
            incoming="$APP_DIR/.env.auth.upload"
            next_file="$(mktemp "$APP_DIR/.env.next.XXXXXX")"
            trap 'rm -f "$incoming" "$next_file"' EXIT
            chmod 600 "$incoming"

            if [ -f "$env_file" ]; then
              grep -Ev '^(APP_ENV|AUTH_ENABLED|GOOGLE_CLIENT_ID|GOOGLE_CLIENT_SECRET|GOOGLE_REDIRECT_URI|AUTH_PUBLIC_BACKEND_ORIGIN|AUTH_ALLOWED_ORIGINS|EMAIL_PUBLIC_BASE_URL|EMAIL_UNSUBSCRIBE_BASE_URL|AUTH_ALLOWED_HOSTS|AUTH_TRUSTED_PROXY_HEADERS|AUTH_TRUSTED_PROXY_HOSTS|AUTH_COOKIE_SECURE|AUTH_COOKIE_SAMESITE)=' \
                "$env_file" > "$next_file" || true
            fi
            cat "$incoming" >> "$next_file"
            chmod 600 "$next_file"
            mv "$next_file" "$env_file"
            rm -f "$incoming"
            trap - EXIT
          REMOTE

      - name: Install and restart development servers
        run: |
          # The application boot/readiness checks can be quiet for several minutes.
          # Keep the SSH transport alive so a healthy but slow restart is not mistaken
          # for a failed deployment and rolled back solely by an idle connection drop.
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -i ~/.ssh/id_rsa -p "$SSH_PORT" etluser@quant-agent.kro.kr \
            bash -s -- "$GITHUB_SHA" <<'REMOTE'
            set -euo pipefail

            DEPLOYMENT_REVISION="$1"
            if [ -f "$HOME/.bashrc" ]; then
              set +u
              source "$HOME/.bashrc"
              set -u
            fi

            APP_DIR="$HOME/mvp_sp2/quant-proj"
            RUN_DIR="$APP_DIR/.run"
            RELEASES_DIR="$HOME/mvp_sp2/.releases"
            SNAPSHOT_DIR="$RELEASES_DIR/$DEPLOYMENT_REVISION"
            SNAPSHOT_ARCHIVE="$SNAPSHOT_DIR/current-release.tar.gz"
            SNAPSHOT_CHECKSUM="$SNAPSHOT_ARCHIVE.sha256"
            READINESS_CHECKER="$SNAPSHOT_DIR/readiness-semantic-gate.mjs"
            mkdir -p "$RUN_DIR"
            SECRET_DIR="$HOME/.config/quantagent"
            mkdir -p "$SECRET_DIR"
            chmod 700 "$SECRET_DIR"

            test -s "$READINESS_CHECKER"

            for auth_var in \
              AUTH_ENABLED \
              GOOGLE_CLIENT_ID \
              GOOGLE_CLIENT_SECRET \
              GOOGLE_REDIRECT_URI \
              AUTH_PUBLIC_BACKEND_ORIGIN \
              AUTH_ALLOWED_ORIGINS \
              AUTH_ALLOWED_HOSTS \
              AUTH_TRUSTED_PROXY_HEADERS \
              AUTH_TRUSTED_PROXY_HOSTS \
              AUTH_COOKIE_SECURE \
              AUTH_COOKIE_SAMESITE
            do
              unset "$auth_var"
            done
            export APP_ENV=production

            snapshot_disallowed_regex='(^|/)(\.env(\..*)?|\.releases|\.run|\.venv|venv)(/|$)|(^|/)(__pycache__|logs|\.pytest_cache|\.ruff_cache|\.mypy_cache|\.cache)(/|$)|(\.pyc|\.log|\.pid|\.sock)$'

            validate_snapshot_archive() {
              local expected_sha256 actual_sha256
              expected_sha256="$(tr -d '\r\n' < "$SNAPSHOT_CHECKSUM")"
              actual_sha256="$(sha256sum "$SNAPSHOT_ARCHIVE" | awk '{print $1}')"
              test "$expected_sha256" = "$actual_sha256"
              if tar -tzf "$SNAPSHOT_ARCHIVE" | grep -Eq "$snapshot_disallowed_regex"; then
                echo "Snapshot archive contains disallowed entries"
                return 1
              fi
            }

            restore_deploy_snapshot() {
              local restore_root
              restore_root="$(mktemp -d "$HOME/mvp_sp1/rollback-snapshot-restore-stage.XXXXXX")"
              trap 'rm -rf "$restore_root"; trap - RETURN' RETURN
              validate_snapshot_archive
              tar -xzf "$SNAPSHOT_ARCHIVE" -C "$restore_root"
              rsync -a --delete --omit-dir-times --no-perms --no-owner --no-group \
                --exclude='.git/' \
                --exclude='node_modules/' \
                --exclude='DE/' \
                --exclude='.env' \
                --exclude='.env.*' \
                --exclude='.releases/' \
                --exclude='.run/' \
                --exclude='.venv/' \
                --exclude='venv/' \
                --exclude='**/.venv/' \
                --exclude='**/venv/' \
                --exclude='ai/.venv/' \
                --exclude='**/__pycache__/' \
                --exclude='**/*.pyc' \
                --exclude='**/logs/' \
                --exclude='**/.pytest_cache/' \
                --exclude='**/.ruff_cache/' \
                --exclude='**/.mypy_cache/' \

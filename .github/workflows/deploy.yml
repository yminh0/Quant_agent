            export AI_RULE_DRAFT_HMAC_KEY_VERSION=server-v1

            "$APP_DIR/ai/.venv/bin/python" - <<'PY'
          from ai_graph.audit_postgres import AuthorizedAuditSink, create_audit_sink_from_env

          if not isinstance(create_audit_sink_from_env(), AuthorizedAuditSink):
              raise RuntimeError("production rollback audit admission was not authorized")
          print("production rollback audit admission authorized")
          PY

            cd "$APP_DIR"
            nohup "$APP_DIR/ai/.venv/bin/python" -m uvicorn combined_main:app \
              --host 0.0.0.0 \
              --port 18011 \
              --workers 1 \
              > "$RUN_DIR/combined.log" 2>&1 &
            echo "$!" > "$RUN_DIR/combined.pid"

            cd "$APP_DIR/fe"
            nohup env \
              COMBINED_BACKEND_PROXY_TARGET="http://127.0.0.1:18011" \
              HOST="0.0.0.0" PORT="18010" node scripts/production-gateway.mjs \
              > "$RUN_DIR/fe.log" 2>&1 &
            echo "$!" > "$RUN_DIR/fe.pid"

            wait_for_url "Combined backend" "http://127.0.0.1:18011/combined-health" "$RUN_DIR/combined.log"
            wait_for_semantic_readiness "Backend readiness" "http://127.0.0.1:18011/readiness" "rollback-backend-readiness"
            curl -fsS 'http://127.0.0.1:18011/ai-api/api-status' \
              | "$APP_DIR/ai/.venv/bin/python" -c \
                'import json,sys; assert json.load(sys.stdin)["job_store"]["active_mode"] == "persistent"'
            wait_for_semantic_readiness "AI API readiness" "http://127.0.0.1:18011/ai-api/readiness" "rollback-ai-api-readiness" ai
            wait_for_url "Frontend gateway" "http://127.0.0.1:18010/" "$RUN_DIR/fe.log"
            touch "$ROLLBACK_MARKER"
          }

          restore_deploy_snapshot
          restart_restored_release
          REMOTE

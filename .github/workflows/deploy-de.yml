name: Deploy DE to SSH Server

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'DE/**'
      - '.github/workflows/deploy-de.yml'

concurrency:
  group: quant-agent-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 30233 quant-agent.kro.kr >> ~/.ssh/known_hosts

      - name: Create deploy directory on server
        run: |
          ssh -i ~/.ssh/id_rsa -p 30233 etluser@quant-agent.kro.kr \
            "mkdir -p ~/mvp_sp1/quant-proj"

      # 저장소 루트의 DE 외 코드도 함께 동기화합니다.
      - name: Deploy application code via rsync
        run: |
          rsync -rlvz --delete \
            --omit-dir-times \
            --no-perms --no-owner --no-group \
            --exclude='.git/' \
            --exclude='DE/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.releases/' \
            --exclude='.run/' \
            --exclude='.venv/' \
            --exclude='venv/' \
            --exclude='**/.venv/' \
            --exclude='**/venv/' \
            --exclude='**/__pycache__/' \
            --exclude='**/*.pyc' \
            --exclude='**/logs/' \
            --exclude='**/.pytest_cache/' \
            --exclude='**/.ruff_cache/' \
            --exclude='**/.mypy_cache/' \
            --exclude='**/.cache/' \
            -e "ssh -i ~/.ssh/id_rsa -p 30233" \
            ./ \
            etluser@quant-agent.kro.kr:~/mvp_sp1/quant-proj/

      # DE 코드는 기존처럼 별도 동기화하여 Airflow 배포를 유지합니다.
      - name: Deploy DE code via rsync
        run: |
          rsync -rlvz --delete \
            --omit-dir-times \
            --no-perms --no-owner --no-group \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='docker/postgres/' \
            --exclude='airflow/logs/' \
            --exclude='airflow/logs/**' \
            --exclude='airflow/dags/logs/' \
            --exclude='airflow/dags/logs/**' \
            --exclude='airflow/airflow.db' \
            --exclude='**/__pycache__/' \
            --exclude='**/*.pyc' \
            -e "ssh -i ~/.ssh/id_rsa -p 30233" \
            DE/ \
            etluser@quant-agent.kro.kr:~/mvp_sp1/quant-proj/DE/

      # 2단계: 파일 동기화가 끝난 후, 최신 시크릿 값이 담긴 .env 파일을 최종적으로 덮어씁니다.
      - name: Deploy DE Environment File
        run: |
          cat << 'EOF' > de_env_temp.txt
          ${{ secrets.DE_ENV_FILE_CONTENT }}
          EOF
          scp -i ~/.ssh/id_rsa -P 30233 de_env_temp.txt etluser@quant-agent.kro.kr:~/mvp_sp1/quant-proj/DE/.env
          rm de_env_temp.txt

      # 3단계: 파일과 환경 변수가 완벽히 정렬된 상태에서 워크스페이스 권한을 수리합니다.
      - name: Repair Airflow workspace ownership
        run: |
          ssh -i ~/.ssh/id_rsa -p 30233 etluser@quant-agent.kro.kr <<'REMOTE'
            set -euo pipefail
            APP_DIR="$HOME/mvp_sp1/quant-proj"
            cd "$APP_DIR/DE"
            export AIRFLOW_UID="$(id -u)"
            docker compose -f docker-compose-airflow-dev.yaml run --rm airflow-init
          REMOTE

      # 4단계: 마지막으로 서버를 내렸다가 새 환경 변수판으로 올립니다.
      - name: Install and restart development servers
        run: |
          ssh -i ~/.ssh/id_rsa -p 30233 etluser@quant-agent.kro.kr <<'REMOTE'
            set -euo pipefail
            APP_DIR="$HOME/mvp_sp1/quant-proj"
            cd "$APP_DIR/DE"
            docker compose -f compose.yaml up -d --wait db
            test "$(docker compose -f compose.yaml exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SHOW max_locks_per_transaction"')" = 1024
            docker compose -f docker-compose-airflow-dev.yaml down
            docker compose -f docker-compose-airflow-dev.yaml up -d --build
          REMOTE

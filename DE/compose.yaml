name: ${COMPOSE_PROJECT_NAME:-quant-agent}

services:
  db:
    image: ${TIMESCALEDB_IMAGE:-timescale/timescaledb:latest-pg17}
    command: ["postgres", "-c", "max_locks_per_transaction=1024"]
    container_name: ${QUANT_DB_CONTAINER_NAME:-quant-agent-db}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${QUANT_DB_NAME:-quant_agent}
      POSTGRES_USER: ${QUANT_DB_USER:-quant_agent}
      POSTGRES_PASSWORD: ${QUANT_DB_PASSWORD:?Set QUANT_DB_PASSWORD in the shell before running Docker Compose}
      TIMESCALEDB_TELEMETRY: ${TIMESCALEDB_TELEMETRY:-off}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - quant_agent_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: ${QUANT_DB_HEALTH_INTERVAL:-10s}
      timeout: ${QUANT_DB_HEALTH_TIMEOUT:-5s}
      retries: ${QUANT_DB_HEALTH_RETRIES:-5}

volumes:
  quant_agent_pgdata:
    name: ${QUANT_DB_VOLUME_NAME:-quant-agent-pgdata}

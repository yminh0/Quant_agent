<!doctype html>
<html lang="ko">
<head>

  <title>QuantAgent Login</title>
  <link rel="stylesheet" href="/static/auth/styles.css">
</head>
<body>
  <main class="card" aria-labelledby="login-title">
    <p class="eyebrow">QuantAgent</p>

  <script src="/static/auth/auth.js" defer></script>

</html>

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantagent-backend"
version = "0.1.0"
description = "Backend-owned FastAPI authentication and QuantAgent integration surface"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic-settings>=2.0",
  "SQLAlchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "redis>=5.0",
  "httpx>=0.27",
  "PyMuPDF>=1.24",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.data" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
